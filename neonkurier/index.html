<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111529"><title>Neonkurier – Die Variablen-Schicht</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101324;color:#f7f1e5;font:17px/1.52 "Avenir Next",system-ui,sans-serif}header,main,footer{max-width:1160px;margin:auto;padding:18px 5%}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #424259}header b{letter-spacing:.11em;font-size:15px}header b:first-letter{color:#ffb17d}button,input{font:inherit}button{cursor:pointer;background:#ffb384;border:1px solid #ffb384;color:#21182a;font-weight:750;border-radius:6px;padding:10px 18px}button:hover{filter:brightness(1.12)}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #89ffe4;outline-offset:3px}.ghost{background:#24283f;color:#f8eddf;border-color:#60617b}header button{font-size:14px;padding:6px 12px}main{padding-top:24px}.scene{position:relative;overflow:hidden;background:#363055;border-radius:14px;border:1px solid #59516b}canvas{width:100%;height:clamp(220px,32vw,340px);display:block}.sign,.counter{position:absolute;top:14px;background:#15152bdc;color:#ffe7c6;padding:5px 11px;border-radius:4px;font:700 12px/1.6 ui-monospace,monospace;letter-spacing:.07em}.sign{left:15px}.counter{right:15px}.card{background:#1a1e34;border:1px solid #393d55;border-radius:13px;margin-top:16px;padding:clamp(18px,3.4vw,40px)}h1,h2,h3,p{margin:0 0 12px}h1{font-size:clamp(42px,7vw,84px);line-height:1;letter-spacing:-.075em;font-weight:900}h2{font-size:clamp(26px,4vw,42px);letter-spacing:-.045em;line-height:1.12}.eyebrow,footer{font:700 12px/1.6 ui-monospace,monospace;letter-spacing:.12em;color:#83ead5}.lede{max-width:680px;color:#d2d2e2}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.box,pre{background:#101425;border:1px solid #3d425f;border-radius:7px;padding:16px}pre{overflow:auto;margin:8px 0;color:#a1efdc;line-height:1.65;font-size:15px}code{color:#a1efdc}label{display:block;font-weight:650;margin:8px 0}input{padding:10px;border:1px solid #73768d;border-radius:5px;background:#121626;color:white;width:100%;max-width:320px}button:disabled{opacity:.5;cursor:default}summary{cursor:pointer;color:#a1efdc}details{margin:16px 0}.msg{margin:12px 0;color:#ffce9f}.msg:empty{display:none}li{margin:8px 0}table{border-collapse:collapse}td,th{padding:5px 14px;border:1px solid #596078;text-align:left}.bar{display:flex;gap:4px;margin:12px 0}.bar i{background:#43465c;width:34px;height:5px}.bar i.on{background:#80dec7}footer{color:#a5a7bf;font-weight:500}a{color:#92ead9}.small{font-size:14px;color:#ced0de} @media(max-width:680px){.grid{grid-template-columns:1fr;gap:8px}header,main,footer{padding-left:12px;padding-right:12px}.card{padding:18px}.counter{font-size:10px}pre{font-size:13px}}
</style>
<header><b>◈ NEONKURIER</b><button class="ghost" id="project">Projektauftrag</button></header>
<main><div class="scene"><canvas id="world" aria-label="Ein mintgrüner Kurierwagen auf einer Straße vor der abendlichen Stadtkulisse"></canvas><span class="sign" id="district">WESTHAFEN</span><span class="counter" id="meter">DEPOT · KM 0,0</span></div><section id="panel" class="card"></section></main><footer>INFORMATIK EF · JAVA / SHAPES AND SPRITES</footer>
<script>
'use strict';
const $=id=>document.getElementById(id), panel=$('panel'), cv=$('world'), ctx=cv.getContext('2d');
const places=['Depot','Paketlager','Ladestation','Signalbrücke','Funkzentrale'];
let lane=0, parcels=0, picked=new Set();
let pos=0, target=0, stage=0, phase='intro', step=0, first=[], missed=false, exam=[], answers=[], back='', prev=0;
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function disc(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fill()}
function poly(points,c){ctx.fillStyle=c;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}
function draw(){
 const w=640,h=210;cv.width=w;cv.height=Math.max(150,Math.round(w*cv.clientHeight/cv.clientWidth));const H=cv.height;ctx.save();ctx.scale(1,H/h);
 let sky=ctx.createLinearGradient(0,0,0,154);sky.addColorStop(0,'#39305d');sky.addColorStop(.58,'#b85e83');sky.addColorStop(1,'#ffb278');ctx.fillStyle=sky;ctx.fillRect(0,0,w,155);
 const sun=490-pos*.03;disc(sun,63,32,'#ffd28f');for(let i=0;i<5;i++)rect(sun-33,64+i*6,66,1+i*.46,'#d98489');
 for(let i=0;i<35;i++){let x=(i*83.7)%640,y=(i*i*3.9)%47;rect(x,y,1,1,'#e3bace')}
 for(let layer=0;layer<2;layer++){let drift=pos*(.12+.19*layer),gap=layer?36:23;for(let i=Math.floor(drift/gap)-1;i<(drift+w)/gap+1;i++){let x=i*gap-drift,seed=Math.abs(Math.sin(i*28.7+layer)),bh=14+seed*(layer?62:48),base=layer?136:117,col=layer?'#3c334f':'#785375';rect(x,base-bh,gap-3,bh,col);rect(x+5,base-bh-4,9,5,col);for(let a=4;a<gap-5;a+=7)for(let j=6;j<bh-3;j+=9)if((Math.abs(i)+a+j)%4)rect(x+a,base-bh+j,3,2,layer?'#c88c88':'#a77a91')}}
 rect(0,130,w,19,'#635070');for(let i=0;i<22;i++)rect((i*49-pos*.55%49),133+i%4*3,18,1,'#ce9293');
 for(let i=-1;i<6;i++){let x=i*165-pos*.55%165;rect(x,94,4,55,'#383249');poly([[x,94],[x+2,84],[x+54,84],[x+54,88],[x+7,88]],'#383249');rect(x+43,88,1,17,'#4c3b50')}
 rect(0,149,w,7,'#292a40');rect(0,151,w,2,'#f6b591');rect(0,156,w,54,'#38394e');for(let i=-1;i<14;i++)rect(i*63-pos%63,182,32,2,'#c5a69c');rect(0,201,w,9,'#1f2135');
 for(let i=0;i<5;i++){let x=155+i*280-pos; if(x < -60||x>655)continue;rect(x,126,3,25,'#242338');rect(x-32,111,72,17,'#242338');ctx.fillStyle='#a3f1dc';ctx.font='bold 8px monospace';ctx.fillText(places[i].toUpperCase(),x-29,122)}
 if(phase==='drive'){const drop=stage*280+140,py=stage%2?187:169;if(!picked.has(stage)){const px=155+drop-pos;rect(px,py-10,12,10,'#ffbc7c');rect(px+5,py-10,2,10,'#995975');if(Math.abs(px-165)<23 && lane===stage%2){picked.add(stage);parcels++;if($('parcel'))$('parcel').textContent='Paket eingesammelt!'}}}
 const x=135,y=lane?179:161;rect(x-4,y+15,73,3,'#252436');poly([[x,y],[x+6,y-14],[x+42,y-14],[x+57,y-2],[x+66,y+1],[x+66,y+12],[x,y+12]],'#79dcca');rect(x+3,y-9,26,10,'#51a8aa');poly([[x+35,y-11],[x+41,y-11],[x+52,y-2],[x+35,y-2]],'#293149');rect(x+5,y-4,15,2,'#dcfff1');rect(x,y+7,66,3,'#43858e');rect(x+60,y+1,7,3,'#ffe6a0');rect(x,y+2,3,3,'#ff807b');for(let n of [12,53]){disc(x+n,y+12,6,'#1d2132');disc(x+n,y+12,2.5,'#9aa4af')}ctx.restore();
 $('meter').textContent=places[stage].toUpperCase()+' · KM '+(pos/280).toFixed(1).replace('.',',');
}
function travel(){phase='drive';target=(stage+1)*280;panel.innerHTML='<p class="eyebrow">KURIERROUTE</p><h2>Unterwegs nach '+places[stage+1]+'</h2><p>Wechsle die Spur per Taste ↑ oder ↓ oder über die Schaltflächen. Sammle unterwegs das orangefarbene Bonuspaket ein.</p><div class="row"><button class="ghost" id="up">↑ Obere Spur</button><button class="ghost" id="down">↓ Untere Spur</button><span id="parcel" role="status"></span></div><div class="row"><button id="skip">Fahrt überspringen</button></div>';$('up').onclick=()=>lane=0;$('down').onclick=()=>lane=1;$('skip').onclick=arrive;prev=0;requestAnimationFrame(tick)}
window.addEventListener('keydown',e=>{if(phase==='drive'&&['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();lane=Number(e.key==='ArrowDown')}});
function tick(t){if(phase!=='drive')return;if(prev)pos=Math.min(target,pos+Math.min(100,t-prev)*.050);prev=t;draw();if(pos>=target)arrive();else requestAnimationFrame(tick)}
function arrive(){pos=target;stage++;step=0;missed=false;draw();if(stage===4){makeExam();examTask()}else task()}
function intro(){phase='intro';panel.innerHTML='<p class="eyebrow">JAVA · EIN KURIERSPIEL</p><h1>Die Variablen-Schicht</h1><p class="lede">Der Westhafen wartet auf seine Lieferung. Belade den Wagen, plane den Ladestopp und bring das Signal der Brücke wieder zum Laufen. Dein Werkzeug ist Java-Code.</p><div class="row"><button id="start">Schicht beginnen →</button><span class="small">3 Trainingsstopps · 1 Funkprüfung</span></div>';$('start').onclick=travel}
const Q=[
['Ladung erfassen','Jede Kiste zählt.','___ kisten = 8;','Welcher Java-Datentyp passt für die ganze Anzahl?','int','Du brauchst den Typ für ganze Zahlen. Er hat drei Buchstaben.','int deklariert eine Variable für ganze Zahlen.'],
['Zweite Lieferung','Erst wird eingeladen, dann ausgeliefert.','int kisten = 8;\nkisten = kisten + 5;\nkisten = kisten - 3;','Wie viele Kisten bleiben im Wagen?','10','Notiere den Wert nach jeder Zeile. Nach dem Einladen sind es 13.','Aus 8 werden 13 und anschließend 10 Kisten.'],
['Die Reserve','Die Leitstelle speichert den Akkustand vor der Fahrt.','int akku = 70;\nint reserve = akku;\nakku = akku - 20;','Welchen Wert hat reserve am Ende?','70','Welche Variable steht in der letzten Zeile links vom Gleichheitszeichen?','reserve bekommt eine Kopie des Wertes 70. Nur akku sinkt auf 50.'],
['Am Schnelllader','Die Ladestation gibt Energie in gleichen Portionen ab.','int akku = 30;\nwhile (akku < 60) {\n    akku = akku + 10;\n}','Wie oft wird die Zuweisung im Schleifenrumpf ausgeführt?','3','Zähle die Änderungen. 30 ist der Startwert, der erste neue Wert ist 40.','Die drei Durchläufe erhöhen den Akku auf 40, 50 und 60. Bei 60 ist 60 < 60 falsch.'],
['Schranke frei','Der Sensor misst die Position in Schritten.','int position = 0;\nwhile (position < 10) {\n    position = position + 4;\n}','Bei welchem Wert hält der Antrieb an?','12','Bei 8 ist die Bedingung noch wahr. Rechne einen weiteren Schritt.','Die Positionen sind 0, 4, 8 und 12. Erst bei 12 ist die Bedingung falsch.'],
['Signal reparieren','Die Schranke soll schließen. Der Motor läuft mit diesem Code endlos.','int hoehe = 3;\nwhile (hoehe > 0) {\n    hoehe = hoehe + 1;\n}','Ersetze genau ein Rechenzeichen im Schleifenrumpf. Welches Zeichen muss an die Stelle von +?','-','Die Höhe muss in jedem Schritt kleiner werden.','Mit hoehe = hoehe - 1 sinkt die Höhe über 2 und 1 auf 0. Der Motor stoppt.']
];
Q.push(...[["Paketwaage", "Die Waage meldet auch Bruchteile eines Kilogramms.", "___ gewicht = 2.75;", "Ergänze den passenden Java-Datentyp für diese Dezimalzahl.", "double", "Das Literal 2.75 hat in Java standardmäßig den Typ double.", "double speichert Gleitkommazahlen. Im Java-Code steht ein Dezimalpunkt."], ["Rampenkennung", "Die Rampe trägt einen einzelnen Kennbuchstaben.", "___ rampe = 'B';", "Welcher Java-Datentyp passt zum Literal 'B'?", "char", "Achte auf die einfachen Anführungszeichen.", "char speichert hier das einzelne Zeichen B."], ["Zielanzeige", "Die Anzeige braucht einen ganzen Ortsnamen.", "___ ziel = \"Westhafen\";", "Welcher Java-Typ passt zur Zeichenkette?", "String", "Der Typname für eine Zeichenkette beginnt mit einem großen S.", "String ist der Typ für Zeichenketten. Textliterale stehen in doppelten Anführungszeichen."], ["Ampelstatus", "Der Sensor meldet, ob die Fahrbahn frei ist.", "___ frei = true;", "Mit welchem Java-Datentyp speicherst du den Wahrheitswert?", "boolean", "Der gesuchte Typ kann die Werte true und false speichern.", "boolean speichert genau einen der beiden Wahrheitswerte true oder false."]]);
const stops=[[0,1,6,7],[2,3,8],[4,5,9]];
function frame(tag,title,desc,code,question){panel.innerHTML='<p class="eyebrow">'+tag+'</p><h2>'+title+'</h2><p class="lede">'+desc+'</p><div class="grid"><div><pre><code>'+esc(code)+'</code></pre></div><form id="form"><label for="answer">'+question+'</label><input id="answer" autocomplete="off" required maxlength="50"><div class="row"><button id="check">Antwort prüfen</button></div></form></div><p id="msg" class="msg" role="status"></p><div id="more"></div>';if(window.innerWidth>700)$('answer').focus({preventScroll:true})}
function task(){phase='training';let list=stops[stage-1],idx=list[step],q=Q[idx];frame(places[stage].toUpperCase()+' · AUFTRAG '+(step+1)+'/'+list.length,...q.slice(0,4));$('form').onsubmit=e=>{e.preventDefault();if($('answer').value.trim().replace('−','-')!==q[4]){missed=true;$('msg').textContent='Noch einmal. '+q[5];return}first[idx]=!missed;$('check').disabled=true;$('answer').disabled=true;$('msg').textContent='Richtig. '+q[6];$('more').innerHTML='<button id="next">'+(step+1<list.length?'Nächster Auftrag':'Weiterfahren')+' →</button>';$('next').focus();$('next').onclick=()=>{if(step+1<list.length){step++;missed=false;task()}else travel()}};if(idx===3)trace()}
function trace(){let v=30;$('more').innerHTML='<details><summary>Ladevorgang Schritt für Schritt ansehen</summary><p id="state">Startwert: akku = 30</p><button class="ghost" id="advance">Bedingung prüfen</button></details>';let check=true;$('advance').onclick=()=>{if(check){$('state').textContent=v+' < 60 ist '+(v<60?'wahr. Die Zuweisung folgt.':'falsch. Die Schleife endet.');if(v>=60){$('advance').disabled=true;return}}else{v+=10;$('state').textContent='Neuer Wert nach der Zuweisung: akku = '+v}check=!check;$('advance').textContent=check?'Bedingung prüfen':'Zuweisung ausführen'}}
function makeExam(){const n=4+Math.floor(Math.random()*6),k=2+Math.floor(Math.random()*4);exam=[
['Paketbestand','int pakete = '+n+';\npakete = pakete + '+k+';\npakete = pakete + pakete;','Welchen Wert hat pakete am Ende?',2*(n+k),'Nach dem Einladen sind es '+(n+k)+' Pakete. Dieser Wert wird verdoppelt.'],
['Zwischenstand','int konto = '+n+';\nint beleg = konto;\nkonto = '+k+';','Welchen Wert hat beleg am Ende?',n,'beleg speichert den ursprünglichen Wert von konto.'],
['Letzte Meile','int meter = 0;\nwhile (meter < '+(3*k-1)+') {\n    meter = meter + '+k+';\n}','Welchen Wert hat meter nach der Schleife?',3*k,'Die Werte sind 0, '+k+', '+(2*k)+' und '+(3*k)+'. Dann ist die Bedingung falsch.'],
['Torwache','int offen = '+n+';\nwhile (offen < '+n+') {\n    offen = offen + 1;\n}','Wie oft läuft der Schleifenrumpf?',0,'Schon die erste Prüfung ergibt falsch. Die beiden Werte sind gleich.']
,
['Paketwaage','double masse = '+n+'.5;\nmasse = masse + 0.25;','Welchen Zahlenwert hat masse jetzt?',n+0.75,'Zur Startmasse kommen 0,25 kg hinzu.'],
['Rampenwechsel',"char rampe = 'B';\nrampe = 'C';",'Welches Zeichen ist jetzt gespeichert? Gib nur das Zeichen ein.','C','Die zweite Zuweisung ersetzt B durch C.'],
['Zielschild','String ort = "West";\nort = ort + "hafen";','Welcher Text steht in ort? Gib nur den Text ein.','Westhafen','Der Operator + hängt die zweite Zeichenkette an die erste an.'],
['Abfahrtskontrolle','int kisten = '+n+';\nboolean voll = kisten > '+n+';','Welchen Java-Wert hat voll?', 'false','Die Anzahl ist gleich der Grenze. Der Vergleich mit > ergibt false.']
];answers=[]}
function examTask(){phase='exam';let q=exam[answers.length];frame('FUNKPRÜFUNG · '+(answers.length+1)+'/'+exam.length,q[0],'Antworte selbstständig. Die Auswertung kommt nach dem letzten Funkspruch.',q[1],q[2]);if(typeof q[3]==='number'){$('answer').inputMode='decimal';$('answer').pattern='-?[0-9]+([.,][0-9]+)?'}$('check').textContent='Funkspruch senden';$('form').onsubmit=e=>{e.preventDefault();const raw=$('answer').value.trim();answers.push(typeof q[3]==='number'?Number(raw.replace(',','.')):raw);if(answers.length<exam.length)examTask();else result()}}
function result(){phase='result';let score=exam.filter((q,i)=>q[3]===answers[i]).length;panel.innerHTML='<p class="eyebrow">SCHICHTBERICHT</p><h2>Lieferung angekommen.</h2><p>Bonuspakete auf der Strecke: '+parcels+'/4.</p><p>Training: '+first.filter(Boolean).length+' von '+Q.length+' Aufträgen im ersten Versuch. <strong>Funkprüfung: '+score+' von '+exam.length+' Punkten.</strong></p>'+exam.map((q,i)=>'<details><summary>'+(answers[i]===q[3]?'✓ Richtig':'✗ Noch üben')+' · '+q[0]+'</summary><pre>'+esc(q[1])+'</pre><p>'+q[2]+' Deine Antwort: '+esc(answers[i])+'. Lösung: '+q[3]+'. '+q[4]+'</p></details>').join('')+'<div class="row"><button id="pr">Zum eigenen SaS-Projekt →</button><button class="ghost" id="again">Funkprüfung wiederholen</button></div>';$('pr').onclick=openProject;$('again').onclick=()=>{makeExam();examTask()}}
let savedNodes=[];
function openProject(){if(phase==='project')return;back=phase;savedNodes=Array.from(panel.childNodes);phase='project';$('project').hidden=true;panel.innerHTML='<p class="eyebrow">WERKSTATT · ARBEITSAUFTRAG</p><h2>Entwickle deine eigene Kurierfahrt.</h2><p>Programmiere in BlueJ mit der SaS-Bibliothek eine kurze, sichtbare Lieferung. Entscheide selbst, was dein Kurier transportiert und wann seine Fahrt endet.</p><ol><li><b>Plane die Fahrt.</b> Skizziere Start und Ziel. Lege für mindestens drei Variablen Namen, Datentyp, Startwert und Bedeutung fest. Beispiele sind Position, Schrittweite und Energievorrat.</li><li><b>Baue die Szene.</b> Erzeuge ein Fenster und zeichne Kurier und Ziel mit SaS-Formen. Setze Start und Ziel so, dass die ganze Strecke im Fenster liegt.</li><li><b>Programmiere die Bewegung.</b> Formuliere eine <code>while</code>-Bedingung. Verschiebe den Kurier pro Durchlauf, aktualisiere mindestens zwei Variablen und gib ihre Werte auf der Konsole aus. Der Kurier soll selbstständig anhalten.</li><li><b>Teste deine Vorhersage.</b> Notiere für einen normalen Start die ersten drei Schritte und den erwarteten Endwert. Teste außerdem einen Start, bei dem die Bedingung sofort falsch ist. Vergleiche Vorhersage und Konsolenausgabe.</li><li><b>Stelle dein Projekt vor.</b> Gib das BlueJ-Projekt und deine beiden Testprotokolle ab. Zeige an einer Codezeile, wie sich ein Wert ändert, und erkläre, warum die Schleife endet.</li></ol><details><summary>Starthilfe für BlueJ und SaS</summary><p>Lege im Projekt mit eingebundener SaS-Bibliothek die Klasse Kurierfahrt an. Übersetze sie und erzeuge in BlueJ ein Objekt mit <code>new Kurierfahrt()</code>. Ergänze den Konstruktor an der markierten Stelle.</p><pre>'+esc('import sas.*;\nimport java.awt.Color;\n\npublic class Kurierfahrt {\n    public Kurierfahrt() {\n        View stadt = new View(640, 360);\n        int x = 30;\n        int schritt = 5;\n        Circle kurier = new Circle(x, 180, 12, Color.BLUE);\n        // Ergänze Ziel, Vorrat und Fahrschleife.\n    }\n}')+'</pre><p><code>kurier.move(schritt, 0);</code> bewegt die Figur. Aktualisiere danach auch deine Positionsvariable. Mit <code>System.out.println(x);</code> kannst du ihren Wert prüfen.</p></details><p class="small"><a href="https://toolsif.net-schulbuch.de/sas.html" target="_blank" rel="noopener">SaS-Dokumentation</a></p><button class="ghost" id="return">Zurück zum Spiel</button>';$('return').onclick=()=>{phase=back;panel.replaceChildren(...savedNodes);$('project').hidden=false;if(phase==='drive'){prev=0;requestAnimationFrame(tick)}}}
$('project').onclick=openProject;window.addEventListener('resize',draw);intro();draw();
</script></html>
